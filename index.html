<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ERP Ikan Asin - UD Putra DMJ</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#182235}
header{height:62px;background:#7a1e0a;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.brand{font-size:19px;font-weight:800}.wrap{display:flex;min-height:calc(100vh - 62px)}aside{width:220px;background:#fff;border-right:1px solid #e4e8ee;padding:12px}
nav button{width:100%;padding:11px;border:0;background:#fff;text-align:left;border-radius:8px;margin:2px 0;cursor:pointer}
nav button.active,nav button:hover{background:#fff0eb;color:#c93d14;font-weight:700}
main{flex:1;padding:22px;max-width:1450px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.card,form{background:#fff;border:1px solid #e3e7ed;border-radius:13px;padding:17px}.big{font-size:24px;font-weight:800;margin-top:6px}.muted{color:#6b7585;font-size:13px}
h1{font-size:24px;margin:0 0 18px}h2{font-size:17px}form{margin-bottom:16px}.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
label{font-size:12px;font-weight:700;color:#566174}input,select{width:100%;padding:9px;margin-top:5px;border:1px solid #d5dae3;border-radius:8px}
.btn{border:0;background:#c93d14;color:#fff;padding:9px 13px;border-radius:8px;font-weight:700;cursor:pointer}.btn.gray{background:#e9edf2;color:#283343}
.actions{margin:0 0 14px;display:flex;gap:8px}.tablewrap{overflow:auto;border:1px solid #e3e7ed;border-radius:11px}
table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:9px 10px;border-bottom:1px solid #edf0f4;text-align:left;font-size:13px;white-space:nowrap}th{background:#fafbfd}
.login{min-height:100vh;display:grid;place-items:center;background:#f5f7fb}.loginbox{width:min(400px,92vw);background:#fff;border:1px solid #e3e7ed;border-radius:16px;padding:27px}
.hide{display:none!important}.msg{padding:10px;border-radius:8px;background:#fff6e8;margin:10px 0;font-size:13px}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.fields{grid-template-columns:1fr 1fr}}
@media(max-width:650px){aside{display:none}main{padding:14px}.fields{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="login" class="login"><div class="loginbox">
<h1>🐟 ERP Ikan Asin</h1><p class="muted">UD Putra DMJ • database online</p>
<label>Email</label><input id="email" type="email" placeholder="admin@putradmj.com">
<label style="display:block;margin-top:11px">Password</label><input id="password" type="password">
<button class="btn" style="width:100%;margin-top:15px" onclick="signIn()">Masuk</button>
<div id="loginmsg" class="msg hide"></div>
</div></div>

<div id="app" class="hide">
<header><div class="brand">🐟 ERP IKAN ASIN • UD PUTRA DMJ</div><button class="btn gray" onclick="signOut()">Keluar</button></header>
<div class="wrap"><aside><nav>
<button class="active" onclick="page('dashboard',this)">📊 Dashboard</button>
<button onclick="page('master',this)">⚙️ Master Data</button>
<button onclick="page('pembelian',this)">🐟 Pembelian</button>
<button onclick="page('produksi',this)">🏭 Produksi</button>
<button onclick="page('penjualan',this)">💰 Penjualan</button>
<button onclick="page('kas',this)">💵 Kas</button>
<button onclick="page('laporan',this)">📑 Laporan</button>
</nav></aside><main id="content"></main></div></div>

<script src="config.js"></script>
<script>
const {createClient}=supabase;
const sb=createClient(window.SUPABASE_URL,window.SUPABASE_PUBLISHABLE_KEY);
let cache={products:[],suppliers:[],customers:[]};

function rupiah(x){return new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(x)||0)}
function n(x){return Number(x)||0}
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function msg(t){alert(t)}
async function signIn(){
 const {error}=await sb.auth.signInWithPassword({email:email.value,password:password.value});
 if(error){loginmsg.textContent=error.message;loginmsg.classList.remove('hide')} else await start();
}
async function signOut(){await sb.auth.signOut();location.reload()}
async function start(){document.getElementById('login').classList.add('hide');document.getElementById('app').classList.remove('hide');await loadMasters();await page('dashboard')}
async function loadMasters(){
 let a=await sb.from('products').select('*').order('name');cache.products=a.data||[];
 let b=await sb.from('suppliers').select('*').order('name');cache.suppliers=b.data||[];
 let c=await sb.from('customers').select('*').order('name');cache.customers=c.data||[];
}
function sel(arr,name,label='Pilih...'){return `<select name="${name}" required><option value="">${label}</option>${arr.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select>`}
async function page(p,el){
 document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));if(el)el.classList.add('active');
 await loadMasters();
 if(p==='dashboard')return dashboard();
 if(p==='master')return master();
 if(p==='pembelian')return purchases();
 if(p==='produksi')return production();
 if(p==='penjualan')return sales();
 if(p==='kas')return cash();
 if(p==='laporan')return report();
}
async function dashboard(){
 const [b,s,p,c]=await Promise.all([sb.from('purchases').select('total_amount'),sb.from('sales').select('total_amount'),sb.from('production').select('output_weight_kg'),sb.from('cash_transactions').select('transaction_type,amount')]);
 let buy=(b.data||[]).reduce((a,x)=>a+n(x.total_amount),0),sale=(s.data||[]).reduce((a,x)=>a+n(x.total_amount),0),prod=(p.data||[]).reduce((a,x)=>a+n(x.output_weight_kg),0),cash=(c.data||[]).reduce((a,x)=>a+(x.transaction_type==='masuk'?n(x.amount):-n(x.amount)),0);
 content.innerHTML=`<h1>Dashboard</h1><div class="grid">
 <div class="card"><div class="muted">Total Pembelian</div><div class="big">${rupiah(buy)}</div></div>
 <div class="card"><div class="muted">Total Penjualan</div><div class="big">${rupiah(sale)}</div></div>
 <div class="card"><div class="muted">Produksi Jadi</div><div class="big">${prod.toLocaleString('id-ID')} kg</div></div>
 <div class="card"><div class="muted">Kas Bersih</div><div class="big">${rupiah(cash)}</div></div></div>
 <div class="card" style="margin-top:15px"><h2>ERP online aktif</h2><p class="muted">Data transaksi disimpan di database Supabase, bukan hanya di browser.</p></div>`;
}
async function master(){
 content.innerHTML=`<h1>Master Data</h1>
 <div class="grid"><form onsubmit="addSupplier(event)"><h2>Supplier</h2><input name="name" placeholder="Nama supplier" required><input name="phone" placeholder="No. HP"><input name="address" placeholder="Alamat"><button class="btn" style="margin-top:10px">Simpan</button></form>
 <form onsubmit="addProduct(event)"><h2>Produk/Ikan</h2><input name="name" placeholder="Contoh: Ikan Layang" required><select name="category"><option value="bahan_baku">Bahan baku</option><option value="produk_jadi">Produk jadi</option><option value="bahan_penolong">Bahan penolong</option></select><input name="price" type="number" placeholder="Harga default/kg"><button class="btn" style="margin-top:10px">Simpan</button></form>
 <form onsubmit="addCustomer(event)"><h2>Customer</h2><input name="name" placeholder="Nama customer" required><input name="phone" placeholder="No. HP"><input name="address" placeholder="Alamat"><button class="btn" style="margin-top:10px">Simpan</button></form></div>`;
}
async function addSupplier(e){e.preventDefault();let f=new FormData(e.target);let {error}=await sb.from('suppliers').insert({name:f.get('name'),phone:f.get('phone'),address:f.get('address')});if(error)msg(error.message);else{msg('Supplier tersimpan');master()}}
async function addProduct(e){e.preventDefault();let f=new FormData(e.target);let {error}=await sb.from('products').insert({name:f.get('name'),category:f.get('category'),default_price:n(f.get('price'))});if(error)msg(error.message);else{msg('Produk tersimpan');master()}}
async function addCustomer(e){e.preventDefault();let f=new FormData(e.target);let {error}=await sb.from('customers').insert({name:f.get('name'),phone:f.get('phone'),address:f.get('address')});if(error)msg(error.message);else{msg('Customer tersimpan');master()}}
async function purchases(){
 content.innerHTML=`<h1>Pembelian Bahan Baku</h1><form onsubmit="savePurchase(event)"><div class="fields">
 <div><label>Tanggal</label><input name="date" type="date" value="${new Date().toISOString().slice(0,10)}" required></div>
 <div><label>Supplier</label>${sel(cache.suppliers,'supplier_id')}</div><div><label>Jenis ikan</label>${sel(cache.products.filter(x=>x.category==='bahan_baku'),'product_id')}</div>
 <div><label>Berat kg</label><input name="weight" type="number" step=".01" required></div><div><label>Harga/kg</label><input name="price" type="number" required></div>
 <div><label>Status</label><select name="status"><option value="lunas">Lunas</option><option value="hutang">Hutang</option><option value="sebagian">Sebagian</option></select></div></div><button class="btn" style="margin-top:12px">Simpan Pembelian</button></form>
 <div id="tbl"></div>`;await purchaseTable();
}
async function savePurchase(e){e.preventDefault();let f=new FormData(e.target),x={purchase_date:f.get('date'),supplier_id:f.get('supplier_id'),product_id:f.get('product_id'),weight_kg:n(f.get('weight')),price_per_kg:n(f.get('price')),payment_status:f.get('status')};let {error}=await sb.from('purchases').insert(x);if(error)msg(error.message);else{msg('Pembelian tersimpan');purchases()}}
async function purchaseTable(){let {data,error}=await sb.from('purchases').select('purchase_date,weight_kg,price_per_kg,total_amount,payment_status,products(name),suppliers(name)').order('purchase_date',{ascending:false}).limit(50);tbl.innerHTML=table(data||[],['purchase_date','suppliers.name','products.name','weight_kg','price_per_kg','total_amount','payment_status'])}
async function production(){
 content.innerHTML=`<h1>Produksi</h1><form onsubmit="saveProduction(event)"><div class="fields">
 <div><label>Tanggal</label><input name="date" type="date" value="${new Date().toISOString().slice(0,10)}" required></div>
 <div><label>Produk jadi</label>${sel(cache.products.filter(x=>x.category==='produk_jadi'),'product_id')}</div>
 <div><label>Bahan baku kg</label><input name="input" type="number" step=".01" required></div><div><label>Hasil jadi kg</label><input name="output" type="number" step=".01" required></div>
 <div><label>Garam</label><input name="salt" type="number" value="0"></div><div><label>Tenaga kerja</label><input name="labor" type="number" value="0"></div>
 <div><label>Biaya lain</label><input name="other" type="number" value="0"></div></div><button class="btn" style="margin-top:12px">Simpan Produksi</button></form><div id="tbl"></div>`;let {data}=await sb.from('production').select('production_date,input_weight_kg,output_weight_kg,total_production_cost,shrinkage_percent,products(name)').order('production_date',{ascending:false}).limit(50);tbl.innerHTML=table(data||[],['production_date','products.name','input_weight_kg','output_weight_kg','shrinkage_percent','total_production_cost'])}
async function saveProduction(e){e.preventDefault();let f=new FormData(e.target),x={production_date:f.get('date'),product_id:f.get('product_id'),input_weight_kg:n(f.get('input')),output_weight_kg:n(f.get('output')),salt_cost:n(f.get('salt')),labor_cost:n(f.get('labor')),other_cost:n(f.get('other'))};let {error}=await sb.from('production').insert(x);if(error)msg(error.message);else{msg('Produksi tersimpan');production()}}
async function sales(){
 content.innerHTML=`<h1>Penjualan</h1><form onsubmit="saveSale(event)"><div class="fields"><div><label>Tanggal</label><input name="date" type="date" value="${new Date().toISOString().slice(0,10)}" required></div><div><label>Customer</label>${sel(cache.customers,'customer_id')}</div><div><label>Produk</label>${sel(cache.products.filter(x=>x.category==='produk_jadi'),'product_id')}</div><div><label>Berat kg</label><input name="weight" type="number" step=".01" required></div><div><label>Harga/kg</label><input name="price" type="number" required></div><div><label>Status</label><select name="status"><option value="lunas">Lunas</option><option value="piutang">Piutang</option><option value="sebagian">Sebagian</option></select></div></div><button class="btn" style="margin-top:12px">Simpan Penjualan</button></form><div id="tbl"></div>`;
 let {data}=await sb.from('sales').select('sale_date,weight_kg,price_per_kg,total_amount,payment_status,products(name),customers(name)').order('sale_date',{ascending:false}).limit(50);tbl.innerHTML=table(data||[],['sale_date','customers.name','products.name','weight_kg','price_per_kg','total_amount','payment_status']);
}
async function saveSale(e){e.preventDefault();let f=new FormData(e.target),x={sale_date:f.get('date'),customer_id:f.get('customer_id'),product_id:f.get('product_id'),weight_kg:n(f.get('weight')),price_per_kg:n(f.get('price')),payment_status:f.get('status')};let {error}=await sb.from('sales').insert(x);if(error)msg(error.message);else{msg('Penjualan tersimpan');sales()}}
async function cash(){
 content.innerHTML=`<h1>Kas</h1><form onsubmit="saveCash(event)"><div class="fields"><div><label>Tanggal</label><input name="date" type="date" value="${new Date().toISOString().slice(0,10)}" required></div><div><label>Jenis</label><select name="type"><option value="masuk">Kas masuk</option><option value="keluar">Kas keluar</option></select></div><div><label>Kategori</label><input name="category" placeholder="Penjualan/listrik/transport" required></div><div><label>Nominal</label><input name="amount" type="number" required></div><div><label>Keterangan</label><input name="note"></div></div><button class="btn" style="margin-top:12px">Simpan Kas</button></form><div id="tbl"></div>`;
 let {data}=await sb.from('cash_transactions').select('*').order('transaction_date',{ascending:false}).limit(50);tbl.innerHTML=table(data||[],['transaction_date','transaction_type','category','amount','reference','notes']);
}
async function saveCash(e){e.preventDefault();let f=new FormData(e.target),x={transaction_date:f.get('date'),transaction_type:f.get('type'),category:f.get('category'),amount:n(f.get('amount')),notes:f.get('note')};let {error}=await sb.from('cash_transactions').insert(x);if(error)msg(error.message);else{msg('Kas tersimpan');cash()}}
async function report(){
 const [b,s,p,e]=await Promise.all([sb.from('purchases').select('total_amount'),sb.from('sales').select('total_amount'),sb.from('production').select('total_production_cost'),sb.from('expenses').select('amount')]);
 let buy=(b.data||[]).reduce((a,x)=>a+n(x.total_amount),0),sale=(s.data||[]).reduce((a,x)=>a+n(x.total_amount),0),pc=(p.data||[]).reduce((a,x)=>a+n(x.total_production_cost),0),ex=(e.data||[]).reduce((a,x)=>a+n(x.amount),0);
 content.innerHTML=`<h1>Laporan Ringkas</h1><div class="grid"><div class="card"><div class="muted">Pembelian</div><div class="big">${rupiah(buy)}</div></div><div class="card"><div class="muted">Penjualan</div><div class="big">${rupiah(sale)}</div></div><div class="card"><div class="muted">Biaya Produksi</div><div class="big">${rupiah(pc)}</div></div><div class="card"><div class="muted">Biaya Operasional</div><div class="big">${rupiah(ex)}</div></div></div><div class="card" style="margin-top:15px"><h2>Catatan</h2><p>HPP final perlu disempurnakan setelah seluruh komponen biaya pabrik dimasukkan.</p></div>`;
}
function table(rows,cols){if(!rows.length)return '<div class="card"><span class="muted">Belum ada data.</span></div>';return '<div class="tablewrap"><table><thead><tr>'+cols.map(c=>`<th>${esc(c)}</th>`).join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+cols.map(c=>{let k=c.includes('.')?c.split('.')[0]:c;let v=c.includes('.')?(r[k]?.name??''):r[k];return `<td>${c.includes('amount')||c.includes('price')||c.includes('cost')?rupiah(v):esc(v)}</td>`}).join('')+'</tr>').join('')+'</tbody></table></div>'}
(async()=>{let {data}=await sb.auth.getSession();if(data.session)start()})()
</script>
</body></html>
