<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ERP Ikan Asin - UD Putra DMJ</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f6f7f9;color:#172033}header{height:62px;background:#7a1e0a;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:5}.brand{font-size:18px;font-weight:800}.wrap{display:flex;min-height:calc(100vh - 62px)}aside{width:225px;background:#fff;border-right:1px solid #e5e8ed;padding:12px;flex-shrink:0}nav button{width:100%;padding:11px;border:0;background:#fff;text-align:left;border-radius:9px;margin:2px 0;cursor:pointer;color:#263246}nav button.active,nav button:hover{background:#fff0eb;color:#c93d14;font-weight:700}main{flex:1;padding:22px;max-width:1500px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card,form{background:#fff;border:1px solid #e2e6ec;border-radius:13px;padding:17px;box-shadow:0 1px 2px #00000008}.big{font-size:23px;font-weight:800;margin-top:6px}.muted{color:#6b7585;font-size:13px}h1{font-size:24px;margin:0 0 18px}h2{font-size:17px;margin-top:0}.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}label{font-size:12px;font-weight:700;color:#566174}input,select{width:100%;padding:10px;margin-top:5px;border:1px solid #d5dae3;border-radius:8px;background:#fff}.btn{border:0;background:#c93d14;color:#fff;padding:9px 13px;border-radius:8px;font-weight:700;cursor:pointer}.btn.gray{background:#e9edf2;color:#283343}.btn.small{padding:7px 10px;font-size:12px}.actions{display:flex;gap:8px;margin:0 0 14px;flex-wrap:wrap}.tablewrap{overflow:auto;border:1px solid #e3e7ed;border-radius:11px;margin-top:12px}table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:9px 10px;border-bottom:1px solid #edf0f4;text-align:left;font-size:13px;white-space:nowrap}th{background:#fafbfd}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef3f8;font-size:11px}.notice{padding:11px;border-radius:9px;background:#fff8e8;border:1px solid #f2dfad;font-size:13px;margin-bottom:14px}.login{min-height:100vh;display:grid;place-items:center;background:#f6f7f9}.loginbox{width:min(410px,92vw);background:#fff;border:1px solid #e3e7ed;border-radius:16px;padding:28px}.hide{display:none!important}.msg{padding:10px;border-radius:8px;background:#fff6e8;margin:10px 0;font-size:13px}.statlabel{font-size:12px;color:#6b7585}.positive{color:#19734b}.negative{color:#b42318}.mobilebar{display:none}
@media(max-width:950px){.grid{grid-template-columns:1fr 1fr}.fields{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}}
@media(max-width:680px){aside{display:none}.mobilebar{display:flex;background:#fff;border-bottom:1px solid #ddd;padding:8px;overflow:auto;gap:5px;position:sticky;top:62px;z-index:4}.mobilebar button{white-space:nowrap;border:0;background:#f4f5f7;padding:8px 10px;border-radius:8px}.wrap main{padding:13px}.fields{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}.brand{font-size:14px}}
</style></head>
<body>
<div id="login" class="login"><div class="loginbox"><h1>🐟 ERP Ikan Asin</h1><p class="muted">UD Putra DMJ • database online</p><label>Email</label><input id="email" type="email" placeholder="Email admin"><label style="display:block;margin-top:11px">Password</label><input id="password" type="password"><button class="btn" style="width:100%;margin-top:15px" onclick="signIn()">Masuk</button><div id="loginmsg" class="msg hide"></div></div></div>
<div id="app" class="hide"><header><div class="brand">🐟 ERP IKAN ASIN • UD PUTRA DMJ</div><button class="btn gray" onclick="signOut()">Keluar</button></header><div class="mobilebar" id="mobileNav"></div><div class="wrap"><aside><nav id="sideNav"></nav></aside><main id="content"></main></div></div>
<script src="config.js"></script><script>
const {createClient}=supabase;const sb=createClient(window.SUPABASE_URL,window.SUPABASE_PUBLISHABLE_KEY);let cache={products:[],suppliers:[],customers:[]};
const menus=[['dashboard','📊 Dashboard'],['master','⚙️ Master Data'],['pembelian','🐟 Pembelian'],['produksi','🏭 Produksi'],['penjualan','💰 Penjualan'],['kas','💵 Kas'],['laporan','📑 Laporan']];
function rupiah(x){return new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(x)||0)}function n(x){return Number(x)||0}function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function today(){return new Date().toISOString().slice(0,10)}function msg(t){alert(t)}
function initNav(){let html=menus.map(([k,t])=>`<button data-page="${k}" onclick="page('${k}',this)">${t}</button>`).join('');sideNav.innerHTML=html;mobileNav.innerHTML=html}
async function signIn(){const {error}=await sb.auth.signInWithPassword({email:email.value,password:password.value});if(error){loginmsg.textContent=error.message;loginmsg.classList.remove('hide')}else await start()}async function signOut(){await sb.auth.signOut();location.reload()}
async function start(){login.classList.add('hide');app.classList.remove('hide');initNav();await loadMasters();await page('dashboard')}
async function loadMasters(){let [a,b,c]=await Promise.all([sb.from('products').select('*').order('name'),sb.from('suppliers').select('*').order('name'),sb.from('customers').select('*').order('name')]);cache.products=a.data||[];cache.suppliers=b.data||[];cache.customers=c.data||[]}
function sel(arr,name,label='Pilih...'){return `<select name="${name}" required><option value="">${label}</option>${arr.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select>`}
async function page(p,el){document.querySelectorAll('nav button,.mobilebar button').forEach(x=>x.classList.remove('active'));document.querySelectorAll(`[data-page="${p}"]`).forEach(x=>x.classList.add('active'));await loadMasters();if(p==='dashboard')dashboard();if(p==='master')master();if(p==='pembelian')purchases();if(p==='produksi')production();if(p==='penjualan')sales();if(p==='kas')cash();if(p==='laporan')report()}
async function getRows(table,fields='*'){let {data,error}=await sb.from(table).select(fields);return error?[]:(data||[])}
async function dashboard(){let [buys,salesRows,prods,cashRows]=await Promise.all([getRows('purchases','purchase_date,product_id,weight_kg,total_amount'),getRows('sales','sale_date,product_id,weight_kg,total_amount'),getRows('production','production_date,product_id,input_weight_kg,output_weight_kg,total_production_cost'),getRows('cash_transactions','transaction_type,amount')]);let buy=buys.reduce((a,x)=>a+n(x.total_amount),0),sale=salesRows.reduce((a,x)=>a+n(x.total_amount),0),out=prods.reduce((a,x)=>a+n(x.output_weight_kg),0),cashv=cashRows.reduce((a,x)=>a+(x.transaction_type==='masuk'?n(x.amount):-n(x.amount)),0);let raw=buys.reduce((a,x)=>a+n(x.weight_kg),0)-prods.reduce((a,x)=>a+n(x.input_weight_kg),0),finished=out-salesRows.reduce((a,x)=>a+n(x.weight_kg),0);let pc=prods.reduce((a,x)=>a+n(x.total_production_cost),0),profit=sale-pc;
content.innerHTML=`<h1>Dashboard</h1><div class="grid"><div class="card"><div class="statlabel">Total Pembelian</div><div class="big">${rupiah(buy)}</div></div><div class="card"><div class="statlabel">Total Penjualan</div><div class="big">${rupiah(sale)}</div></div><div class="card"><div class="statlabel">Produksi Jadi</div><div class="big">${out.toLocaleString('id-ID')} kg</div></div><div class="card"><div class="statlabel">Kas Bersih</div><div class="big">${rupiah(cashv)}</div></div></div><div class="grid" style="margin-top:14px"><div class="card"><div class="statlabel">Estimasi Stok Bahan Baku</div><div class="big">${raw.toLocaleString('id-ID',{maximumFractionDigits:2})} kg</div></div><div class="card"><div class="statlabel">Estimasi Stok Produk Jadi</div><div class="big">${finished.toLocaleString('id-ID',{maximumFractionDigits:2})} kg</div></div><div class="card"><div class="statlabel">Biaya Produksi</div><div class="big">${rupiah(pc)}</div></div><div class="card"><div class="statlabel">Selisih Penjualan - Biaya Produksi</div><div class="big ${profit>=0?'positive':'negative'}">${rupiah(profit)}</div></div></div><div class="notice" style="margin-top:14px"><b>Catatan stok:</b> stok di dashboard dihitung dari transaksi pembelian, produksi, dan penjualan. Ini adalah stok operasional dan belum memperhitungkan retur/penyesuaian stok manual.</div>`}
async function master(){content.innerHTML=`<h1>Master Data</h1><div class="grid2"><form onsubmit="addSupplier(event)"><h2>Supplier</h2><div class="fields"><div><label>Nama</label><input name="name" required></div><div><label>No. HP</label><input name="phone"></div><div><label>Alamat</label><input name="address"></div></div><button class="btn" style="margin-top:12px">Simpan Supplier</button></form><form onsubmit="addCustomer(event)"><h2>Customer</h2><div class="fields"><div><label>Nama</label><input name="name" required></div><div><label>No. HP</label><input name="phone"></div><div><label>Alamat</label><input name="address"></div></div><button class="btn" style="margin-top:12px">Simpan Customer</button></form></div><form onsubmit="addProduct(event)" style="margin-top:14px"><h2>Produk / Jenis Ikan</h2><div class="fields"><div><label>Nama produk</label><input name="name" placeholder="Ikan Layang" required></div><div><label>Kategori</label><select name="category"><option value="bahan_baku">Bahan baku</option><option value="produk_jadi">Produk jadi</option><option value="bahan_penolong">Bahan penolong</option></select></div><div><label>Harga default/kg</label><input name="price" type="number" value="0"></div></div><button class="btn" style="margin-top:12px">Simpan Produk</button></form><div class="grid2" style="margin-top:14px"><div class="card"><h2>Produk tersimpan</h2>${simpleList(cache.products,['name','category','default_price'])}</div><div class="card"><h2>Supplier tersimpan</h2>${simpleList(cache.suppliers,['name','phone'])}</div></div>`}
async function addSupplier(e){e.preventDefault();let f=new FormData(e.target);let {error}=await sb.from('suppliers').insert({name:f.get('name'),phone:f.get('phone'),address:f.get('address')});if(error)msg(error.message);else{msg('Supplier tersimpan');master()}}async function addCustomer(e){e.preventDefault();let f=new FormData(e.target);let {error}=await sb.from('customers').insert({name:f.get('name'),phone:f.get('phone'),address:f.get('address')});if(error)msg(error.message);else{msg('Customer tersimpan');master()}}async function addProduct(e){e.preventDefault();let f=new FormData(e.target);let {error}=await sb.from('products').insert({name:f.get('name'),category:f.get('category'),default_price:n(f.get('price'))});if(error)msg(error.message);else{msg('Produk tersimpan');master()}}
async function purchases(){content.innerHTML=`<h1>Pembelian Bahan Baku</h1><form onsubmit="savePurchase(event)"><div class="fields"><div><label>Tanggal</label><input name="date" type="date" value="${today()}" required></div><div><label>Supplier</label>${sel(cache.suppliers,'supplier_id')}</div><div><label>Jenis ikan</label>${sel(cache.products.filter(x=>x.category==='bahan_baku'),'product_id')}</div><div><label>Berat (kg)</label><input name="weight" type="number" step=".01" required></div><div><label>Harga/kg</label><input name="price" type="number" required></div><div><label>Status pembayaran</label><select name="status"><option value="lunas">Lunas</option><option value="hutang">Hutang</option><option value="sebagian">Sebagian</option></select></div></div><button class="btn" style="margin-top:12px">Simpan Pembelian</button></form><div id="tbl"></div>`;let {data,error}=await sb.from('purchases').select('purchase_date,weight_kg,price_per_kg,total_amount,payment_status,products(name),suppliers(name)').order('purchase_date',{ascending:false}).limit(100);tbl.innerHTML=table(data||[],['purchase_date','suppliers.name','products.name','weight_kg','price_per_kg','total_amount','payment_status'],error)}
async function savePurchase(e){e.preventDefault();let f=new FormData(e.target),x={purchase_date:f.get('date'),supplier_id:f.get('supplier_id'),product_id:f.get('product_id'),weight_kg:n(f.get('weight')),price_per_kg:n(f.get('price')),payment_status:f.get('status')};let {error}=await sb.from('purchases').insert(x);if(error)msg(error.message);else{msg('Pembelian tersimpan');purchases()}}
async function production(){let finished=cache.products.filter(x=>x.category==='produk_jadi');content.innerHTML=`<h1>Produksi / Pengeringan</h1><div class="notice"><b>Contoh:</b> ikan basah 1.000 kg → hasil jadi 600 kg. Sistem menghitung penyusutan dari berat input dan output.</div><form onsubmit="saveProduction(event)"><div class="fields"><div><label>Tanggal</label><input name="date" type="date" value="${today()}" required></div><div><label>Produk jadi</label>${sel(finished,'product_id')}</div><div><label>Bahan baku (kg)</label><input name="input" type="number" step=".01" required></div><div><label>Hasil jadi (kg)</label><input name="output" type="number" step=".01" required></div><div><label>Garam</label><input name="salt" type="number" value="0"></div><div><label>Tenaga kerja</label><input name="labor" type="number" value="0"></div><div><label>Biaya lain</label><input name="other" type="number" value="0"></div></div><button class="btn" style="margin-top:12px">Simpan Produksi</button></form><div id="tbl"></div>`;let {data,error}=await sb.from('production').select('production_date,input_weight_kg,output_weight_kg,total_production_cost,shrinkage_percent,products(name)').order('production_date',{ascending:false}).limit(100);tbl.innerHTML=table(data||[],['production_date','products.name','input_weight_kg','output_weight_kg','shrinkage_percent','total_production_cost'],error)}
async function saveProduction(e){e.preventDefault();let f=new FormData(e.target),input=n(f.get('input')),output=n(f.get('output'));if(output>input){msg('Hasil jadi tidak boleh lebih besar dari bahan baku.');return}let x={production_date:f.get('date'),product_id:f.get('product_id'),input_weight_kg:input,output_weight_kg:output,salt_cost:n(f.get('salt')),labor_cost:n(f.get('labor')),other_cost:n(f.get('other'))};let {error}=await sb.from('production').insert(x);if(error)msg(error.message);else{msg('Produksi tersimpan');production()}}
async function sales(){let finished=cache.products.filter(x=>x.category==='produk_jadi');content.innerHTML=`<h1>Penjualan</h1><form onsubmit="saveSale(event)"><div class="fields"><div><label>Tanggal</label><input name="date" type="date" value="${today()}" required></div><div><label>Customer</label>${sel(cache.customers,'customer_id')}</div><div><label>Produk</label>${sel(finished,'product_id')}</div><div><label>Berat (kg)</label><input name="weight" type="number" step=".01" required></div><div><label>Harga/kg</label><input name="price" type="number" required></div><div><label>Status pembayaran</label><select name="status"><option value="lunas">Lunas</option><option value="piutang">Piutang</option><option value="sebagian">Sebagian</option></select></div></div><button class="btn" style="margin-top:12px">Simpan Penjualan</button></form><div id="tbl"></div>`;let {data,error}=await sb.from('sales').select('sale_date,weight_kg,price_per_kg,total_amount,payment_status,products(name),customers(name)').order('sale_date',{ascending:false}).limit(100);tbl.innerHTML=table(data||[],['sale_date','customers.name','products.name','weight_kg','price_per_kg','total_amount','payment_status'],error)}
async function saveSale(e){e.preventDefault();let f=new FormData(e.target),x={sale_date:f.get('date'),customer_id:f.get('customer_id'),product_id:f.get('product_id'),weight_kg:n(f.get('weight')),price_per_kg:n(f.get('price')),payment_status:f.get('status')};let {error}=await sb.from('sales').insert(x);if(error)msg(error.message);else{msg('Penjualan tersimpan');sales()}}
async function cash(){content.innerHTML=`<h1>Kas</h1><form onsubmit="saveCash(event)"><div class="fields"><div><label>Tanggal</label><input name="date" type="date" value="${today()}" required></div><div><label>Jenis</label><select name="type"><option value="masuk">Kas masuk</option><option value="keluar">Kas keluar</option></select></div><div><label>Kategori</label><input name="category" placeholder="Penjualan / listrik / transport" required></div><div><label>Nominal</label><input name="amount" type="number" required></div><div><label>Keterangan</label><input name="note"></div></div><button class="btn" style="margin-top:12px">Simpan Kas</button></form><div id="tbl"></div>`;let {data,error}=await sb.from('cash_transactions').select('*').order('transaction_date',{ascending:false}).limit(100);tbl.innerHTML=table(data||[],['transaction_date','transaction_type','category','amount','reference','notes'],error)}
async function saveCash(e){e.preventDefault();let f=new FormData(e.target),x={transaction_date:f.get('date'),transaction_type:f.get('type'),category:f.get('category'),amount:n(f.get('amount')),notes:f.get('note')};let {error}=await sb.from('cash_transactions').insert(x);if(error)msg(error.message);else{msg('Kas tersimpan');cash()}}
async function report(){let [b,s,p,e]=await Promise.all([getRows('purchases','total_amount,weight_kg,price_per_kg'),getRows('sales','total_amount,weight_kg,price_per_kg'),getRows('production','total_production_cost,output_weight_kg'),getRows('expenses','amount')]);let buy=b.reduce((a,x)=>a+n(x.total_amount),0),sale=s.reduce((a,x)=>a+n(x.total_amount),0),pc=p.reduce((a,x)=>a+n(x.total_production_cost),0),ex=e.reduce((a,x)=>a+n(x.amount),0),output=p.reduce((a,x)=>a+n(x.output_weight_kg),0),hpp=output?pc/output:0;content.innerHTML=`<h1>Laporan</h1><div class="grid"><div class="card"><div class="statlabel">Pembelian</div><div class="big">${rupiah(buy)}</div></div><div class="card"><div class="statlabel">Penjualan</div><div class="big">${rupiah(sale)}</div></div><div class="card"><div class="statlabel">Biaya Produksi</div><div class="big">${rupiah(pc)}</div></div><div class="card"><div class="statlabel">HPP Produksi/kg</div><div class="big">${rupiah(hpp)}</div></div></div><div class="grid" style="margin-top:14px"><div class="card"><div class="statlabel">Biaya Operasional</div><div class="big">${rupiah(ex)}</div></div><div class="card"><div class="statlabel">Selisih Penjualan - Biaya Produksi</div><div class="big ${sale-pc>=0?'positive':'negative'}">${rupiah(sale-pc)}</div></div><div class="card"><div class="statlabel">Total Output Produksi</div><div class="big">${output.toLocaleString('id-ID')} kg</div></div><div class="card"><div class="statlabel">Margin setelah biaya produksi</div><div class="big">${sale?((sale-pc)/sale*100).toFixed(1):0}%</div></div></div><div class="notice" style="margin-top:14px"><b>Penting:</b> HPP di sini adalah HPP biaya produksi yang sudah tercatat di tabel produksi. Agar HPP akuntansi benar-benar lengkap, harga ikan basah per batch dan biaya overhead perlu dimasukkan ke desain tahap berikutnya.</div>`}
function simpleList(rows,cols){if(!rows.length)return '<span class="muted">Belum ada data.</span>';return '<div class="tablewrap"><table><thead><tr>'+cols.map(c=>`<th>${esc(c)}</th>`).join('')+'</tr></thead><tbody>'+rows.slice(0,30).map(r=>'<tr>'+cols.map(c=>`<td>${c.includes('price')?rupiah(r[c]):esc(r[c])}</td>`).join('')+'</tr>').join('')+'</tbody></table></div>'}
function table(rows,cols,error){if(error)return `<div class="notice">Gagal membaca data: ${esc(error.message)}</div>`;if(!rows.length)return '<div class="card"><span class="muted">Belum ada data.</span></div>';return '<div class="tablewrap"><table><thead><tr>'+cols.map(c=>`<th>${esc(c)}</th>`).join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+cols.map(c=>{let k=c.includes('.')?c.split('.')[0]:c,v=c.includes('.')?(r[k]?.name??''):r[k];let money=/amount|price|cost/.test(c);return `<td>${money?rupiah(v):esc(v)}</td>`}).join('')+'</tr>').join('')+'</tbody></table></div>'}
(async()=>{let {data}=await sb.auth.getSession();if(data.session)start()})();
</script></body></html>
