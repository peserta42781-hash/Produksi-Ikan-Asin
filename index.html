<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ERP Ikan Asin - UD Putra DMJ</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f6f7f9;color:#172033}header{height:62px;background:#7a1e0a;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:5}.brand{font-size:18px;font-weight:800}.wrap{display:flex;min-height:calc(100vh - 62px)}aside{width:225px;background:#fff;border-right:1px solid #e5e8ed;padding:12px;flex-shrink:0}nav button{width:100%;padding:11px;border:0;background:#fff;text-align:left;border-radius:9px;margin:2px 0;cursor:pointer;color:#263246}nav button.active,nav button:hover{background:#fff0eb;color:#c93d14;font-weight:700}main{flex:1;padding:22px;max-width:1500px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card,form{background:#fff;border:1px solid #e2e6ec;border-radius:13px;padding:17px;box-shadow:0 1px 2px #00000008}.big{font-size:23px;font-weight:800;margin-top:6px}.muted{color:#6b7585;font-size:13px}h1{font-size:24px;margin:0 0 18px}h2{font-size:17px;margin-top:0}.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}label{font-size:12px;font-weight:700;color:#566174}input,select{width:100%;padding:10px;margin-top:5px;border:1px solid #d5dae3;border-radius:8px;background:#fff}.btn{border:0;background:#c93d14;color:#fff;padding:9px 13px;border-radius:8px;font-weight:700;cursor:pointer}.btn.gray{background:#e9edf2;color:#283343}.btn.small{padding:7px 10px;font-size:12px}.btn.danger{background:#b42318}.delete-btn{background:#b42318;color:#fff;border:0;padding:6px 9px;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer}.actions{display:flex;gap:8px;margin:0 0 14px;flex-wrap:wrap}.tablewrap{overflow:auto;border:1px solid #e3e7ed;border-radius:11px;margin-top:12px}table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:9px 10px;border-bottom:1px solid #edf0f4;text-align:left;font-size:13px;white-space:nowrap}th{background:#fafbfd}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef3f8;font-size:11px}.notice{padding:11px;border-radius:9px;background:#fff8e8;border:1px solid #f2dfad;font-size:13px;margin-bottom:14px}.login{min-height:100vh;display:grid;place-items:center;background:#f6f7f9}.loginbox{width:min(410px,92vw);background:#fff;border:1px solid #e3e7ed;border-radius:16px;padding:28px}.hide{display:none!important}.msg{padding:10px;border-radius:8px;background:#fff6e8;margin:10px 0;font-size:13px}.statlabel{font-size:12px;color:#6b7585}.positive{color:#19734b}.negative{color:#b42318}.mobilebar{display:none}
@media(max-width:950px){.grid{grid-template-columns:1fr 1fr}.fields{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}}
@media(max-width:680px){aside{display:none}.mobilebar{display:flex;background:#fff;border-bottom:1px solid #ddd;padding:8px;overflow:auto;gap:5px;position:sticky;top:62px;z-index:4}.mobilebar button{white-space:nowrap;border:0;background:#f4f5f7;padding:8px 10px;border-radius:8px}.wrap main{padding:13px}.fields{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}.brand{font-size:14px}}
</style></head>
<body>
<div id="login" class="login"><div class="loginbox"><h1>🐟 ERP Ikan Asin</h1><p class="muted">UD Putra DMJ • database online</p><label>Email</label><input id="email" type="email" placeholder="Email admin"><label style="display:block;margin-top:11px">Password</label><input id="password" type="password"><button class="btn" style="width:100%;margin-top:15px" onclick="signIn()">Masuk</button><div id="loginmsg" class="msg hide"></div></div></div>
<div id="app" class="hide"><header><div class="brand">🐟 ERP IKAN ASIN • UD PUTRA DMJ</div><button class="btn gray" onclick="signOut()">Keluar</button></header><div class="mobilebar" id="mobileNav"></div><div class="wrap"><aside><nav id="sideNav"></nav></aside><main id="content"></main></div></div>
<script src="config.js"></script><script>
const {createClient}=supabase;const sb=createClient(window.SUPABASE_URL,window.SUPABASE_PUBLISHABLE_KEY);let cache={products:[],suppliers:[],customers:[]};
const menus=[['dashboard','📊 Dashboard'],['master','⚙️ Master Data'],['pembelian','🐟 Pembelian'],['produksi','🏭 Produksi'],['penjualan','💰 Penjualan'],['kas','💵 Kas'],['biaya','🧾 Biaya'],['hpp','🧮 HPP'],['laporan','📑 Laporan']];
function rupiah(x){return new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(x)||0)}function n(x){return Number(x)||0}function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function today(){return new Date().toISOString().slice(0,10)}function msg(t){alert(t)}
function initNav(){let html=menus.map(([k,t])=>`<button data-page="${k}" onclick="page('${k}',this)">${t}</button>`).join('');sideNav.innerHTML=html;mobileNav.innerHTML=html}
async function signIn(){const {error}=await sb.auth.signInWithPassword({email:email.value,password:password.value});if(error){loginmsg.textContent=error.message;loginmsg.classList.remove('hide')}else await start()}async function signOut(){await sb.auth.signOut();location.reload()}
async function start(){login.classList.add('hide');app.classList.remove('hide');initNav();await loadMasters();await page('dashboard')}
async function loadMasters(){let [a,b,c]=await Promise.all([sb.from('products').select('*').order('name'),sb.from('suppliers').select('*').order('name'),sb.from('customers').select('*').order('name')]);cache.products=a.data||[];cache.suppliers=b.data||[];cache.customers=c.data||[]}
function sel(arr,name,label='Pilih...'){return `<select name="${name}" required><option value="">${label}</option>${arr.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select>`}
async function page(p,el){document.querySelectorAll('nav button,.mobilebar button').forEach(x=>x.classList.remove('active'));document.querySelectorAll(`[data-page="${p}"]`).forEach(x=>x.classList.add('active'));await loadMasters();if(p==='dashboard')dashboard();if(p==='master')master();if(p==='pembelian')purchases();if(p==='produksi')production();if(p==='penjualan')sales();if(p==='kas')cash();if(p==='biaya')costs();if(p==='hpp')hppPage();if(p==='laporan')report()}
async function getRows(table,fields='*'){let {data,error}=await sb.from(table).select(fields);return error?[]:(data||[])}
async function dashboard(){let [buys,salesRows,prods,cashRows]=await Promise.all([getRows('purchases','purchase_date,product_id,weight_kg,total_amount'),getRows('sales','sale_date,product_id,weight_kg,total_amount'),getRows('production','production_date,product_id,input_weight_kg,output_weight_kg,total_production_cost,overhead_allocated'),getRows('cash_transactions','transaction_type,amount')]);let buy=buys.reduce((a,x)=>a+n(x.total_amount),0),sale=salesRows.reduce((a,x)=>a+n(x.total_amount),0),out=prods.reduce((a,x)=>a+n(x.output_weight_kg),0),cashv=cashRows.reduce((a,x)=>a+(x.transaction_type==='masuk'?n(x.amount):-n(x.amount)),0);let raw=buys.reduce((a,x)=>a+n(x.weight_kg),0)-prods.reduce((a,x)=>a+n(x.input_weight_kg),0),finished=out-salesRows.reduce((a,x)=>a+n(x.weight_kg),0);let pc=prods.reduce((a,x)=>a+n(x.total_production_cost)+n(x.overhead_allocated),0),profit=sale-pc;
content.innerHTML=`<h1>Dashboard</h1><div class="grid"><div class="card"><div class="statlabel">Total Pembelian</div><div class="big">${rupiah(buy)}</div></div><div class="card"><div class="statlabel">Total Penjualan</div><div class="big">${rupiah(sale)}</div></div><div class="card"><div class="statlabel">Produksi Jadi</div><div class="big">${out.toLocaleString('id-ID')} kg</div></div><div class="card"><div class="statlabel">Kas Bersih</div><div class="big">${rupiah(cashv)}</div></div></div><div class="grid" style="margin-top:14px"><div class="card"><div class="statlabel">Estimasi Stok Bahan Baku</div><div class="big">${raw.toLocaleString('id-ID',{maximumFractionDigits:2})} kg</div></div><div class="card"><div class="statlabel">Estimasi Stok Produk Jadi</div><div class="big">${finished.toLocaleString('id-ID',{maximumFractionDigits:2})} kg</div></div><div class="card"><div class="statlabel">Biaya Produksi</div><div class="big">${rupiah(pc)}</div></div><div class="card"><div class="statlabel">Selisih Penjualan - Biaya Produksi</div><div class="big ${profit>=0?'positive':'negative'}">${rupiah(profit)}</div></div></div><div class="notice" style="margin-top:14px"><b>Catatan stok:</b> stok di dashboard dihitung dari transaksi pembelian, produksi, dan penjualan. Ini adalah stok operasional dan belum memperhitungkan retur/penyesuaian stok manual.</div>`}
async function master(){content.innerHTML=`<h1>Master Data</h1><div class="notice"><b>Koreksi data:</b> gunakan tombol <b>Hapus</b> pada data yang salah, lalu input ulang data yang benar. Penghapusan membutuhkan konfirmasi.</div><div class="grid2"><form onsubmit="addSupplier(event)"><h2>Supplier</h2><div class="fields"><div><label>Nama</label><input name="name" required></div><div><label>No. HP</label><input name="phone"></div><div><label>Alamat</label><input name="address"></div></div><button class="btn" style="margin-top:12px">Simpan Supplier</button></form><form onsubmit="addCustomer(event)"><h2>Customer</h2><div class="fields"><div><label>Nama</label><input name="name" required></div><div><label>No. HP</label><input name="phone"></div><div><label>Alamat</label><input name="address"></div></div><button class="btn" style="margin-top:12px">Simpan Customer</button></form></div><form onsubmit="addProduct(event)" style="margin-top:14px"><h2>Produk / Jenis Ikan</h2><div class="fields"><div><label>Nama produk</label><input name="name" placeholder="Ikan Layang" required></div><div><label>Kategori</label><select name="category"><option value="bahan_baku">Bahan baku</option><option value="produk_jadi">Produk jadi</option><option value="bahan_penolong">Bahan penolong</option></select></div><div><label>Harga default/kg</label><input name="price" type="number" value="0"></div></div><button class="btn" style="margin-top:12px">Simpan Produk</button></form><div class="grid2" style="margin-top:14px"><div class="card"><h2>Produk tersimpan</h2>${simpleList(cache.products,['name','category','default_price'], 'products')}</div><div class="card"><h2>Supplier tersimpan</h2>${simpleList(cache.suppliers,['name','phone'], 'suppliers')}</div></div><div class="card" style="margin-top:14px"><h2>Customer tersimpan</h2>${simpleList(cache.customers,['name','phone'], 'customers')}</div>`}

async function addSupplier(e){e.preventDefault();let f=new FormData(e.target);let {error}=await sb.from('suppliers').insert({name:f.get('name'),phone:f.get('phone'),address:f.get('address')});if(error)msg(error.message);else{msg('Supplier tersimpan');master()}}async function addCustomer(e){e.preventDefault();let f=new FormData(e.target);let {error}=await sb.from('customers').insert({name:f.get('name'),phone:f.get('phone'),address:f.get('address')});if(error)msg(error.message);else{msg('Customer tersimpan');master()}}async function addProduct(e){e.preventDefault();let f=new FormData(e.target);let {error}=await sb.from('products').insert({name:f.get('name'),category:f.get('category'),default_price:n(f.get('price'))});if(error)msg(error.message);else{msg('Produk tersimpan');master()}}
async function purchases(){content.innerHTML=`<h1>Pembelian Bahan Baku</h1><form onsubmit="savePurchase(event)"><div class="fields"><div><label>Tanggal</label><input name="date" type="date" value="${today()}" required></div><div><label>Supplier</label>${sel(cache.suppliers,'supplier_id')}</div><div><label>Jenis ikan</label>${sel(cache.products.filter(x=>x.category==='bahan_baku'),'product_id')}</div><div><label>Berat (kg)</label><input name="weight" type="number" step=".01" required></div><div><label>Harga/kg</label><input name="price" type="number" required></div><div><label>Status pembayaran</label><select name="status"><option value="lunas">Lunas</option><option value="hutang">Hutang</option><option value="sebagian">Sebagian</option></select></div></div><button class="btn" style="margin-top:12px">Simpan Pembelian</button></form><div id="tbl"></div>`;let {data,error}=await sb.from('purchases').select('id,purchase_date,weight_kg,price_per_kg,total_amount,payment_status,products(name),suppliers(name)').order('purchase_date',{ascending:false}).limit(100);tbl.innerHTML=table(data||[],['purchase_date','suppliers.name','products.name','weight_kg','price_per_kg','total_amount','payment_status'],error,'purchases')}
async function savePurchase(e){e.preventDefault();let f=new FormData(e.target),x={purchase_date:f.get('date'),supplier_id:f.get('supplier_id'),product_id:f.get('product_id'),weight_kg:n(f.get('weight')),price_per_kg:n(f.get('price')),payment_status:f.get('status')};let {error}=await sb.from('purchases').insert(x);if(error)msg(error.message);else{msg('Pembelian tersimpan');purchases()}}
async function production(){let finished=cache.products.filter(x=>x.category==='produk_jadi'),raws=cache.products.filter(x=>x.category==='bahan_baku');content.innerHTML=`<h1>Produksi / Pengeringan</h1><div class="notice"><b>Tahap 3:</b> setiap batch produksi mencatat bahan baku, biaya langsung, overhead, penyusutan, dan HPP. Harga bahan baku dihitung dari rata-rata tertimbang transaksi pembelian bahan baku sampai tanggal produksi.</div><form onsubmit="saveProduction(event)"><div class="fields"><div><label>Tanggal</label><input name="date" type="date" value="${today()}" required></div><div><label>Produk jadi</label>${sel(finished,'product_id')}</div><div><label>Bahan baku</label>${sel(raws,'raw_product_id')}</div><div><label>Bahan baku (kg)</label><input name="input" type="number" step=".01" min="0" required></div><div><label>Hasil jadi (kg)</label><input name="output" type="number" step=".01" min="0" required></div><div><label>Garam / biaya langsung</label><input name="salt" type="number" value="0" min="0"></div><div><label>Tenaga kerja langsung</label><input name="labor" type="number" value="0" min="0"></div><div><label>Biaya lain langsung</label><input name="other" type="number" value="0" min="0"></div></div><button class="btn" style="margin-top:12px">Simpan Produksi & Hitung HPP</button></form><div id="tbl"></div>`;let {data,error}=await sb.from('production').select('*').order('production_date',{ascending:false}).limit(100);if(error){tbl.innerHTML=`<div class="notice">Gagal membaca produksi: ${esc(error.message)}</div>`;return}let rows=(data||[]).map(r=>({...r,products:{name:cache.products.find(x=>x.id===r.product_id)?.name||'-'},raw_products:{name:cache.products.find(x=>x.id===r.raw_product_id)?.name||'-'}}));tbl.innerHTML=table(rows,['production_date','products.name','raw_products.name','input_weight_kg','output_weight_kg','shrinkage_percent','raw_material_cost','total_production_cost','overhead_allocated','hpp_total','hpp_per_kg'],null,'production')}
async function weightedPurchaseCost(productId,date){let {data,error}=await sb.from('purchases').select('weight_kg,total_amount,purchase_date').eq('product_id',productId).lte('purchase_date',date);if(error)throw new Error(error.message);let q=(data||[]).reduce((a,x)=>a+n(x.weight_kg),0),v=(data||[]).reduce((a,x)=>a+n(x.total_amount),0);return q>0?v/q:0}
async function saveProduction(e){e.preventDefault();let f=new FormData(e.target),input=n(f.get('input')),output=n(f.get('output')),rawId=f.get('raw_product_id');if(output>input){msg('Hasil jadi tidak boleh lebih besar dari bahan baku.');return}if(!rawId){msg('Pilih bahan baku.');return}try{let unit=await weightedPurchaseCost(rawId,f.get('date'));if(unit<=0){msg('Belum ditemukan transaksi pembelian untuk bahan baku tersebut sampai tanggal produksi.');return}let salt=n(f.get('salt')),labor=n(f.get('labor')),other=n(f.get('other')),direct=salt+labor+other,rawCost=input*unit,total=rawCost+direct;let x={production_date:f.get('date'),product_id:f.get('product_id'),raw_product_id:rawId,input_weight_kg:input,output_weight_kg:output,salt_cost:salt,labor_cost:labor,other_cost:other,raw_material_unit_cost:unit,raw_material_cost:rawCost,hpp_total:total,hpp_per_kg:output>0?total/output:0};let {error}=await sb.from('production').insert(x);if(error)msg(error.message);else{msg(`Produksi tersimpan. HPP batch ${rupiah(total)} / ${output.toLocaleString('id-ID')} kg = ${rupiah(output>0?total/output:0)}/kg`);production()}}catch(err){msg(err.message)}}
async function sales(){let finished=cache.products.filter(x=>x.category==='produk_jadi');content.innerHTML=`<h1>Penjualan</h1><form onsubmit="saveSale(event)"><div class="fields"><div><label>Tanggal</label><input name="date" type="date" value="${today()}" required></div><div><label>Customer</label>${sel(cache.customers,'customer_id')}</div><div><label>Produk</label>${sel(finished,'product_id')}</div><div><label>Berat (kg)</label><input name="weight" type="number" step=".01" required></div><div><label>Harga/kg</label><input name="price" type="number" required></div><div><label>Status pembayaran</label><select name="status"><option value="lunas">Lunas</option><option value="piutang">Piutang</option><option value="sebagian">Sebagian</option></select></div></div><button class="btn" style="margin-top:12px">Simpan Penjualan</button></form><div id="tbl"></div>`;let {data,error}=await sb.from('sales').select('id,sale_date,weight_kg,price_per_kg,total_amount,payment_status,products(name),customers(name)').order('sale_date',{ascending:false}).limit(100);tbl.innerHTML=table(data||[],['sale_date','customers.name','products.name','weight_kg','price_per_kg','total_amount','payment_status'],error,'sales')}
async function saveSale(e){e.preventDefault();let f=new FormData(e.target),x={sale_date:f.get('date'),customer_id:f.get('customer_id'),product_id:f.get('product_id'),weight_kg:n(f.get('weight')),price_per_kg:n(f.get('price')),payment_status:f.get('status')};let {error}=await sb.from('sales').insert(x);if(error)msg(error.message);else{msg('Penjualan tersimpan');sales()}}
async function cash(){content.innerHTML=`<h1>Kas</h1><form onsubmit="saveCash(event)"><div class="fields"><div><label>Tanggal</label><input name="date" type="date" value="${today()}" required></div><div><label>Jenis</label><select name="type"><option value="masuk">Kas masuk</option><option value="keluar">Kas keluar</option></select></div><div><label>Kategori</label><input name="category" placeholder="Penjualan / listrik / transport" required></div><div><label>Nominal</label><input name="amount" type="number" required></div><div><label>Keterangan</label><input name="note"></div></div><button class="btn" style="margin-top:12px">Simpan Kas</button></form><div id="tbl"></div>`;let {data,error}=await sb.from('cash_transactions').select('*').order('transaction_date',{ascending:false}).limit(100);tbl.innerHTML=table(data||[],['transaction_date','transaction_type','category','amount','reference','notes'],error,'cash_transactions')}
async function saveCash(e){e.preventDefault();let f=new FormData(e.target),x={transaction_date:f.get('date'),transaction_type:f.get('type'),category:f.get('category'),amount:n(f.get('amount')),notes:f.get('note')};let {error}=await sb.from('cash_transactions').insert(x);if(error)msg(error.message);else{msg('Kas tersimpan');cash()}}
async function costs(){
let [emps,salt,elec,pay,other]=await Promise.all([
 sb.from('employees').select('*').order('name'),sb.from('salt_purchases').select('*').order('purchase_date',{ascending:false}),
 sb.from('electricity_expenses').select('*').order('week_start',{ascending:false}),sb.from('employee_daily_payments').select('*,employees(name)').order('payment_date',{ascending:false}),sb.from('other_expenses').select('*').order('expense_date',{ascending:false})]);
let E=emps.data||[],S=salt.data||[],L=elec.data||[],P=pay.data||[],O=other.data||[]; cacheEmp=E;
content.innerHTML=`<h1>Biaya Operasional</h1>
<div class="notice"><b>Tahap 2:</b> biaya garam dicatat bulanan, listrik mingguan, pegawai harian, dan biaya lain. Biaya periode dapat dialokasikan otomatis ke batch produksi berdasarkan <b>berat output (kg)</b>.</div>
<div class="grid2">
<form onsubmit="addEmployee(event)"><h2>👷 Pegawai</h2><div class="fields"><div><label>Nama</label><input name="name" required></div><div><label>Jabatan</label><input name="position"></div><div><label>Upah/hari</label><input name="wage" type="number" required></div></div><button class="btn">Simpan Pegawai</button></form>
<form onsubmit="addSalt(event)"><h2>🧂 Pembelian Garam Bulanan</h2><div class="fields"><div><label>Tanggal</label><input name="date" type="date" value="${today()}" required></div><div><label>Supplier</label><input name="supplier"></div><div><label>Jumlah (kg)</label><input name="qty" type="number" step=".01" required></div><div><label>Harga/kg</label><input name="price" type="number" required></div><div><label>Status</label><select name="status"><option>lunas</option><option>hutang</option><option>sebagian</option></select></div></div><button class="btn">Simpan Garam</button></form>
<form onsubmit="addElec(event)"><h2>⚡ Listrik Mingguan</h2><div class="fields"><div><label>Mulai</label><input name="start" type="date" value="${today()}" required></div><div><label>Selesai</label><input name="end" type="date" value="${today()}" required></div><div><label>Nominal</label><input name="amount" type="number" required></div></div><button class="btn">Simpan Listrik</button></form>
<form onsubmit="addPay(event)"><h2>👷 Pembayaran Pegawai Harian</h2><div class="fields"><div><label>Tanggal</label><input name="date" type="date" value="${today()}" required></div><div><label>Pegawai</label><select name="employee" required><option value="">Pilih...</option>${E.filter(x=>x.active).map(x=>`<option value="${x.id}">${esc(x.name)} — ${rupiah(x.daily_wage)}</option>`).join('')}</select></div><div><label>Hari</label><input name="days" type="number" step=".5" value="1" required></div><div><label>Lembur</label><input name="ot" type="number" value="0"></div><div><label>Bonus</label><input name="bonus" type="number" value="0"></div></div><button class="btn">Simpan Upah</button></form>
<form onsubmit="addOther(event)" style="grid-column:1/-1"><h2>📦 Biaya Lain</h2><div class="fields"><div><label>Tanggal</label><input name="date" type="date" value="${today()}" required></div><div><label>Kategori</label><input name="category" placeholder="BBM / kemasan / air / perawatan" required></div><div><label>Nominal</label><input name="amount" type="number" required></div><div><label>Keterangan</label><input name="notes"></div></div><button class="btn">Simpan Biaya</button></form></div>
<div class="card" style="margin-top:14px"><h2>⚙️ Alokasi Biaya ke Produksi</h2><div class="notice">Sistem menjumlahkan biaya pada periode tersebut lalu membaginya ke batch produksi berdasarkan proporsi <b>output kg</b>. Jika alokasi dijalankan lagi untuk bulan yang sama, alokasi lama akan diganti dengan perhitungan terbaru.</div><form onsubmit="allocateCosts(event)"><div class="fields"><div><label>Bulan</label><input name="month" type="month" value="${today().slice(0,7)}" required></div></div><button class="btn">Hitung & Alokasikan</button></form><div id="allocationResult" class="msg hide"></div></div>
<div class="grid" style="margin-top:14px"><div class="card"><div class="statlabel">Total Garam</div><div class="big">${rupiah(S.reduce((a,x)=>a+n(x.total_amount),0))}</div></div><div class="card"><div class="statlabel">Total Listrik</div><div class="big">${rupiah(L.reduce((a,x)=>a+n(x.amount),0))}</div></div><div class="card"><div class="statlabel">Total Pegawai</div><div class="big">${rupiah(P.reduce((a,x)=>a+n(x.total_amount),0))}</div></div><div class="card"><div class="statlabel">Biaya Lain</div><div class="big">${rupiah(O.reduce((a,x)=>a+n(x.amount),0))}</div></div></div>
<h2 style="margin-top:22px">Daftar Biaya</h2>${table(S,['purchase_date','supplier_name','quantity_kg','price_per_kg','total_amount','payment_status'],null,'salt_purchases')}${table(L,['week_start','week_end','amount','notes'],null,'electricity_expenses')}${table(P,['payment_date','employees.name','days','wage','overtime','bonus','total_amount'],null,'employee_daily_payments')}${table(O,['expense_date','category','amount','notes'],null,'other_expenses')}
<h2 style="margin-top:22px">Daftar Pegawai</h2>${table(E,['name','position','daily_wage','active'],null,'employees')}`;
}
function errorSafe(x){return x}
async function allocateCosts(e){
e.preventDefault();let f=new FormData(e.target),month=f.get('month');if(!month)return;
let start=month+'-01', end=new Date(Number(month.slice(0,4)),Number(month.slice(5,7)),0).toISOString().slice(0,10);
let [salt,elec,pay,other,prod]=await Promise.all([
 sb.from('salt_purchases').select('id,total_amount,purchase_date').gte('purchase_date',start).lte('purchase_date',end),
 sb.from('electricity_expenses').select('id,amount,week_start,week_end').gte('week_start',start).lte('week_start',end),
 sb.from('employee_daily_payments').select('id,total_amount,payment_date').gte('payment_date',start).lte('payment_date',end),
 sb.from('other_expenses').select('id,amount,expense_date').gte('expense_date',start).lte('expense_date',end),
 sb.from('production').select('id,production_date,output_weight_kg,total_production_cost').gte('production_date',start).lte('production_date',end)
]);
for(const r of [salt,elec,pay,other,prod])if(r.error){msg('Gagal membaca data: '+r.error.message);return}
let rows=prod.data||[], totalOutput=rows.reduce((a,x)=>a+n(x.output_weight_kg),0);
if(!rows.length||totalOutput<=0){msg('Belum ada batch produksi dengan output > 0 pada bulan tersebut.');return}
let totals={garam:(salt.data||[]).reduce((a,x)=>a+n(x.total_amount),0),listrik:(elec.data||[]).reduce((a,x)=>a+n(x.amount),0),pegawai:(pay.data||[]).reduce((a,x)=>a+n(x.total_amount),0),lain:(other.data||[]).reduce((a,x)=>a+n(x.amount),0)};
let {error:delErr}=await sb.from('production_cost_allocations').delete().eq('period_month',start);if(delErr){msg('Gagal menghapus alokasi lama: '+delErr.message);return}
let inserts=[];for(const r of rows){let share=n(r.output_weight_kg)/totalOutput;for(const type of Object.keys(totals)){if(totals[type]<=0)continue;inserts.push({period_month:start,production_id:r.id,cost_type:type,source_amount:totals[type],allocated_amount:totals[type]*share,allocation_weight_kg:n(r.output_weight_kg),method:'proporsional_output'});}}
if(inserts.length){let {error}=await sb.from('production_cost_allocations').insert(inserts);if(error){msg('Gagal menyimpan alokasi: '+error.message);return}}
for(const r of rows){let allocated=inserts.filter(x=>x.production_id===r.id).reduce((a,x)=>a+n(x.allocated_amount),0);let {data:batch,error:getErr}=await sb.from('production').select('raw_material_cost,total_production_cost,output_weight_kg').eq('id',r.id).single();if(getErr){msg('Gagal membaca batch: '+getErr.message);return}let hppTotal=n(batch.raw_material_cost)+n(batch.total_production_cost)+allocated;let {error}=await sb.from('production').update({overhead_allocated:allocated,hpp_total:hppTotal,hpp_per_kg:n(batch.output_weight_kg)>0?hppTotal/n(batch.output_weight_kg):0}).eq('id',r.id);if(error){msg('Alokasi tersimpan, tetapi gagal memperbarui HPP batch: '+error.message);return}}
let total=Object.values(totals).reduce((a,x)=>a+x,0);let box=document.getElementById('allocationResult');box.textContent=`Alokasi ${month} selesai. Total biaya dialokasikan ${rupiah(total)} ke ${rows.length} batch produksi.`;box.classList.remove('hide');msg('Alokasi biaya berhasil');production();
}
async function addEmployee(e){e.preventDefault();let f=new FormData(e.target),{error}=await sb.from('employees').insert({name:f.get('name'),position:f.get('position'),daily_wage:n(f.get('wage'))});if(error)msg(error.message);else{msg('Pegawai tersimpan');costs()}}
async function addSalt(e){e.preventDefault();let f=new FormData(e.target),{error}=await sb.from('salt_purchases').insert({purchase_date:f.get('date'),supplier_name:f.get('supplier'),quantity_kg:n(f.get('qty')),price_per_kg:n(f.get('price')),payment_status:f.get('status')});if(error)msg(error.message);else{msg('Pembelian garam tersimpan');costs()}}
async function addElec(e){e.preventDefault();let f=new FormData(e.target),{error}=await sb.from('electricity_expenses').insert({week_start:f.get('start'),week_end:f.get('end'),amount:n(f.get('amount'))});if(error)msg(error.message);else{msg('Biaya listrik tersimpan');costs()}}
async function addPay(e){e.preventDefault();let f=new FormData(e.target),emp=cacheEmp.find(x=>x.id===f.get('employee'));let {error}=await sb.from('employee_daily_payments').insert({payment_date:f.get('date'),employee_id:f.get('employee'),days:n(f.get('days')),wage:n(emp?.daily_wage),overtime:n(f.get('ot')),bonus:n(f.get('bonus'))});if(error)msg(error.message);else{msg('Upah tersimpan');costs()}}
async function addOther(e){e.preventDefault();let f=new FormData(e.target),{error}=await sb.from('other_expenses').insert({expense_date:f.get('date'),category:f.get('category'),amount:n(f.get('amount')),notes:f.get('notes')});if(error)msg(error.message);else{msg('Biaya tersimpan');costs()}}
let cacheEmp=[];
async function hppPage(){let [prods,salesRows]=await Promise.all([getRows('production','*'),getRows('sales','*')]);let byId=id=>cache.products.find(x=>x.id===id)?.name||'-';let rows=prods.map(r=>({...r,productName:byId(r.product_id),rawName:byId(r.raw_product_id)}));let totalHpp=rows.reduce((a,r)=>a+n(r.hpp_total),0),out=rows.reduce((a,r)=>a+n(r.output_weight_kg),0),avg=out?totalHpp/out:0;let prodMap={};for(const r of rows){let k=r.product_id;prodMap[k]??={name:byId(k),output:0,hpp:0};prodMap[k].output+=n(r.output_weight_kg);prodMap[k].hpp+=n(r.hpp_total)}let salesMap={};for(const r of salesRows){let k=r.product_id;salesMap[k]??={name:byId(k),kg:0,sales:0};salesMap[k].kg+=n(r.weight_kg);salesMap[k].sales+=n(r.total_amount)}let margin=Object.entries(salesMap).map(([id,v])=>{let p=prodMap[id]||{output:0,hpp:0,name:v.name};let hppKg=p.output>0?p.hpp/p.output:0;let hppSold=hppKg*v.kg;let gross=v.sales-hppSold;return {name:v.name,kg:v.kg,sales:v.sales,hppKg,hppSold,gross,margin:v.sales?gross/v.sales*100:0}});content.innerHTML=`<h1>HPP & Margin</h1><div class="notice"><b>HPP per batch</b> = bahan baku + biaya produksi langsung + overhead teralokasi. HPP/kg = HPP batch ÷ hasil jadi. Margin produk menggunakan HPP/kg rata-rata tertimbang dari batch produksi yang tersedia.</div><div class="grid"><div class="card"><div class="statlabel">Total HPP Batch</div><div class="big">${rupiah(totalHpp)}</div></div><div class="card"><div class="statlabel">Total Output</div><div class="big">${out.toLocaleString('id-ID')} kg</div></div><div class="card"><div class="statlabel">HPP Rata-rata/kg</div><div class="big">${rupiah(avg)}</div></div><div class="card"><div class="statlabel">Jumlah Batch</div><div class="big">${rows.length}</div></div></div><h2 style="margin-top:22px">HPP Per Batch</h2>${rows.length?`<div class="tablewrap"><table><thead><tr><th>Tanggal</th><th>Produk Jadi</th><th>Bahan Baku</th><th>Input</th><th>Output</th><th>Penyusutan</th><th>Bahan Baku Rp</th><th>Biaya Langsung</th><th>Overhead</th><th>Total HPP</th><th>HPP/kg</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.production_date)}</td><td>${esc(r.productName)}</td><td>${esc(r.rawName)}</td><td>${n(r.input_weight_kg).toLocaleString('id-ID')}</td><td>${n(r.output_weight_kg).toLocaleString('id-ID')}</td><td>${n(r.shrinkage_percent).toFixed(2)}%</td><td>${rupiah(r.raw_material_cost)}</td><td>${rupiah(r.total_production_cost)}</td><td>${rupiah(r.overhead_allocated)}</td><td>${rupiah(r.hpp_total)}</td><td>${rupiah(r.hpp_per_kg)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="card">Belum ada batch produksi.</div>'}<h2 style="margin-top:22px">Margin Per Produk</h2>${margin.length?`<div class="tablewrap"><table><thead><tr><th>Produk</th><th>Terjual</th><th>Penjualan</th><th>HPP/kg</th><th>Estimasi HPP Terjual</th><th>Margin Kotor</th><th>Margin %</th></tr></thead><tbody>${margin.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.kg.toLocaleString('id-ID')} kg</td><td>${rupiah(x.sales)}</td><td>${rupiah(x.hppKg)}</td><td>${rupiah(x.hppSold)}</td><td>${rupiah(x.gross)}</td><td>${x.margin.toFixed(2)}%</td></tr>`).join('')}</tbody></table></div>`:'<div class="card">Belum ada penjualan untuk dihitung margin.</div>'}`}

async function report(){let [b,s,p,e]=await Promise.all([getRows('purchases','total_amount,weight_kg,price_per_kg'),getRows('sales','total_amount,weight_kg,price_per_kg'),getRows('production','total_production_cost,overhead_allocated,raw_material_cost,hpp_total,hpp_per_kg,output_weight_kg'),getRows('expenses','amount')]);let buy=b.reduce((a,x)=>a+n(x.total_amount),0),sale=s.reduce((a,x)=>a+n(x.total_amount),0),pc=p.reduce((a,x)=>a+n(x.total_production_cost)+n(x.overhead_allocated),0),ex=e.reduce((a,x)=>a+n(x.amount),0),output=p.reduce((a,x)=>a+n(x.output_weight_kg),0),hpp=output?pc/output:0;content.innerHTML=`<h1>Laporan</h1><div class="grid"><div class="card"><div class="statlabel">Pembelian</div><div class="big">${rupiah(buy)}</div></div><div class="card"><div class="statlabel">Penjualan</div><div class="big">${rupiah(sale)}</div></div><div class="card"><div class="statlabel">Biaya Produksi</div><div class="big">${rupiah(pc)}</div></div><div class="card"><div class="statlabel">HPP Produksi/kg</div><div class="big">${rupiah(hpp)}</div></div></div><div class="grid" style="margin-top:14px"><div class="card"><div class="statlabel">Biaya Operasional</div><div class="big">${rupiah(ex)}</div></div><div class="card"><div class="statlabel">Selisih Penjualan - Biaya Produksi</div><div class="big ${sale-pc>=0?'positive':'negative'}">${rupiah(sale-pc)}</div></div><div class="card"><div class="statlabel">Total Output Produksi</div><div class="big">${output.toLocaleString('id-ID')} kg</div></div><div class="card"><div class="statlabel">Margin setelah biaya produksi</div><div class="big">${sale?((sale-pc)/sale*100).toFixed(1):0}%</div></div></div><div class="notice" style="margin-top:14px"><b>Catatan:</b> HPP Tahap 3 sudah memasukkan bahan baku berdasarkan rata-rata tertimbang pembelian, biaya produksi langsung, dan overhead yang dialokasikan dari Tahap 2.</div>`}
function simpleList(rows,cols,tableName){if(!rows.length)return '<span class="muted">Belum ada data.</span>';return '<div class="tablewrap"><table><thead><tr>'+cols.map(c=>`<th>${esc(c)}</th>`).join('')+'<th>Aksi</th></tr></thead><tbody>'+rows.slice(0,100).map(r=>'<tr>'+cols.map(c=>`<td>${c.includes('price')?rupiah(r[c]):esc(r[c])}</td>`).join('')+`<td><button class="delete-btn" onclick="deleteRow('${tableName}','${r.id}')">Hapus</button></td></tr>`).join('')+'</tbody></table></div>'}
function table(rows,cols,error,tableName){if(error)return `<div class="notice">Gagal membaca data: ${esc(error.message)}</div>`;if(!rows.length)return '<div class="card"><span class="muted">Belum ada data.</span></div>';return '<div class="tablewrap"><table><thead><tr>'+cols.map(c=>`<th>${esc(c)}</th>`).join('')+'<th>Aksi</th></tr></thead><tbody>'+rows.map(r=>'<tr>'+cols.map(c=>{let k=c.includes('.')?c.split('.')[0]:c,v=c.includes('.')?(r[k]?.name??''):r[k];let money=/amount|price|cost/.test(c);return `<td>${money?rupiah(v):esc(v)}</td>`}).join('')+`<td><button class="delete-btn" onclick="deleteRow('${tableName}','${r.id}')">Hapus</button></td></tr>`).join('')+'</tbody></table></div>'}
async function deleteRow(tableName,id){if(!id)return;if(!confirm('Hapus data ini? Tindakan ini tidak dapat dibatalkan.'))return;let {error}=await sb.from(tableName).delete().eq('id',id);if(error){msg('Data gagal dihapus: '+error.message);return}msg('Data berhasil dihapus');if(tableName==='purchases')purchases();else if(tableName==='production')production();else if(tableName==='sales')sales();else if(tableName==='cash_transactions')cash();else if(['products','suppliers','customers'].includes(tableName))master(); else if(['employees','salt_purchases','electricity_expenses','employee_daily_payments','other_expenses'].includes(tableName))costs()}
(async()=>{let {data}=await sb.auth.getSession();if(data.session)start()})();
</script></body></html>
